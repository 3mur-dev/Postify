spring.application.name=Postify

spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.dev-seeder.enabled=false

# File Uploads — limited to 10 MB to prevent disk exhaustion attacks
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.base-path=${STORAGE_BASE_PATH:./uploads}
app.storage.avatar-path=${STORAGE_AVATAR_PATH:avatars}
app.storage.post-path=${STORAGE_POST_PATH:posts}

# HikariCP
# HikariCP — detect connections held open for more than 10 seconds
spring.datasource.hikari.leak-detection-threshold=10000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=true

#cloudinary
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

#storage provider
app.storage.provider=cloudinary

#Kafka
spring.kafka.bootstrap-servers=localhost:9092
logging.level.org.apache.kafka.clients=WARN

#PyCharm
postify.ml.base-url=http://localhost:8000
postify.ml.service-token=${ML_SERVICE_TOKEN}

#Cookie
postify.cookie.secure=false
