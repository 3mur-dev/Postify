# =====================================================
# Postify — Production Configuration
# =====================================================

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — no auto DDL in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP — strict leak detection in production
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}

# Flyway — never baseline in production; migrations must be explicit
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Cookies — always secure in production (HTTPS required)
postify.cookie.secure=true

# File Uploads — strict limits to prevent disk exhaustion
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.base-path=${STORAGE_BASE_PATH:./uploads}
app.storage.avatar-path=${STORAGE_AVATAR_PATH:avatars}
app.storage.post-path=${STORAGE_POST_PATH:posts}

# CORS — restrict to known production origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cloudinary
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
app.storage.provider=cloudinary

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
logging.level.org.apache.kafka.clients=WARN

# ML Service
postify.ml.base-url=${ML_BASE_URL}
postify.ml.service-token=${ML_SERVICE_TOKEN}

# Logging — structured output for production log aggregation
logging.level.root=INFO
logging.level.com.omar.postify=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
