spring.config.import=optional:file:.env.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.cors.allowed-origins=http://localhost:5173

app.storage.base-path=./test-uploads
app.storage.avatar-path=avatars
app.storage.post-path=posts
app.storage.provider=cloudinary

app.dev-seeder.enabled=false

# ML Service
postify.ml.base-url=http://localhost:8000
postify.ml.service-token=test-ml-token