version: '3.8'

services:
  ####################################
  # Postify Backend
  ####################################
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postify-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/postify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - ML_BASE_URL=http://ml-service:8000
      - ML_SERVICE_TOKEN=${ML_SERVICE_TOKEN:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      - STORAGE_BASE_PATH=./uploads
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  ####################################
  # MySQL Database
  ####################################
  db:
    image: mysql:8.0
    container_name: postify-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_DATABASE=postify
      - MYSQL_USER=${DB_USERNAME:-root}
      - MYSQL_PASSWORD=${DB_PASSWORD:-password}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ####################################
  # Zookeeper (for Kafka)
  ####################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: postify-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    restart: unless-stopped

  ####################################
  # Kafka
  ####################################
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: postify-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      zookeeper:
        condition: service_started
    restart: unless-stopped

  ####################################
  # Qdrant (Vector Database)
  ####################################
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: postify-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  ####################################
  # LocalAI (Embeddings)
  ####################################
  localai:
    image: localai/localai:v3.0.0
    container_name: postify-localai
    ports:
      - "8081:8080"
    volumes:
      - localai-models:/build/models
    environment:
      - OAI_MODELS=qwen3-embedding-0.6b
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  qdrant-data:
    driver: local
  localai-models:
    driver: local
